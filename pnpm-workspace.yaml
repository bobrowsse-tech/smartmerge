packages:
  - "packages/*"
  - "packages/adapters/*"

# pnpm 12 delays brand-new releases by default. This project tracks current versions.
minimumReleaseAge: 0

allowBuilds:
  esbuild: true
  # Grammars ship prebuilt wasm. The native binding script is not required.
  tree-sitter-javascript: false
  tree-sitter-typescript: false
