packages:
  - "packages/*"
  - "packages/adapters/*"

# pnpm 12 delays brand-new releases by default. This project tracks current versions.
minimumReleaseAge: 0

allowBuilds:
  "@vscode/vsce-sign": true
  esbuild: true
  keytar: false
  # Grammars ship prebuilt wasm. The native binding script is not required.
  tree-sitter-javascript: false
  tree-sitter-json: false
  tree-sitter-typescript: false
  "@tree-sitter-grammars/tree-sitter-yaml": false
  tree-sitter-python: false
  tree-sitter-go: false
  tree-sitter-java: false
  "@tree-sitter-grammars/tree-sitter-kotlin": false
  tree-sitter-c-sharp: false
  tree-sitter-rust: false
  tree-sitter-c: false
  tree-sitter-cpp: false
  tree-sitter-php: false
  tree-sitter-ruby: false
