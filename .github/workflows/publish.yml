name: Publish

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Require the tag to point at main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "This tag does not point at a commit on main. Publish refused."
            exit 1
          fi

      - uses: pnpm/action-setup@v6
        with:
          version: 12.6.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Install the panel browser
        run: pnpm --filter @smartmerge/ui exec playwright install --with-deps chromium
      - run: pnpm typecheck
      - name: Test
        run: pnpm turbo run test --filter=!@smartmerge/daemon --filter=!@smartmerge/ui
      - name: Tool tests
        run: pnpm test:tools
      - name: Speed budgets
        run: pnpm turbo run test --filter=@smartmerge/daemon --filter=@smartmerge/ui
      - run: pnpm build

      - name: Publish public packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          SMARTMERGE_VERSION: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'EOF'
          import { readdirSync, readFileSync, statSync, writeFileSync } from "node:fs";
          import { join } from "node:path";

          const version = (process.env.SMARTMERGE_VERSION ?? "").replace(/^v/, "");
          if (!/^\d+\.\d+\.\d+$/.test(version)) {
            console.error("SMARTMERGE_VERSION must be a vX.Y.Z tag.");
            process.exit(1);
          }
          const names = [];
          function walk(dir) {
            for (const entry of readdirSync(dir)) {
              const full = join(dir, entry);
              if (statSync(full).isDirectory()) {
                if (entry === "node_modules" || entry === "dist") continue;
                walk(full);
              } else if (entry === "package.json") {
                const pkg = JSON.parse(readFileSync(full, "utf8"));
                if (pkg.private !== true && typeof pkg.name === "string") {
                  names.push(pkg.name);
                  pkg.version = version;
                  writeFileSync(full, `${JSON.stringify(pkg, null, 2)}\n`);
                }
              }
            }
          }
          walk("packages");
          const modeFile = join(process.env.RUNNER_TEMP ?? ".", "publish-mode");
          if (names.length === 0) {
            console.log("No public packages yet. Tag recorded; npm publish skipped.");
            writeFileSync(modeFile, "skip");
            process.exit(0);
          }
          if (!process.env.NODE_AUTH_TOKEN) {
            console.error("Public packages exist but NPM_TOKEN is not set: " + names.join(", "));
            process.exit(1);
          }
          console.log("Publishing " + names.join(", ") + " at " + version + ".");
          writeFileSync(modeFile, "publish");
          EOF
          if [ "$(cat "$RUNNER_TEMP/publish-mode")" = "publish" ]; then
            pnpm publish -r --access public --no-git-checks
          fi

      - name: Publish the editor extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          SMARTMERGE_VERSION: ${{ github.ref_name }}
        run: |
          if [ -z "$VSCE_PAT" ] || [ -z "$OVSX_PAT" ]; then
            echo "VSCE_PAT or OVSX_PAT is not set. The editor extension was not published."
            exit 0
          fi
          pnpm --filter @smartmerge/vscode pack:vsix
          version="${SMARTMERGE_VERSION#v}"
          vsix="$GITHUB_WORKSPACE/packages/adapters/vscode/smartmerge-resolver-${version}.vsix"
          if [ ! -f "$vsix" ]; then
            echo "The extension package was not created."
            exit 1
          fi
          pnpm --filter @smartmerge/vscode exec vsce publish --pre-release --packagePath "$vsix" -p "$VSCE_PAT"
          pnpm --filter @smartmerge/vscode exec ovsx publish "$vsix" --pre-release --pat "$OVSX_PAT"

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
